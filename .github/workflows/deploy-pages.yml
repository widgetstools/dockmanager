name: Deploy Demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/**'
      - 'apps/angular-demo/**'
      - 'packages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm run build:core

      - name: Build React package
        run: npm run build

      - name: Build Angular package
        run: npm run build:angular

      - name: Build React demo
        run: npm run build --workspace=demo

      - name: Build Angular demo
        run: npm run build:angular-demo

      - name: Assemble deployment directory
        run: |
          mkdir -p deploy/angular

          # React demo at root
          cp -r apps/demo/dist/. deploy/

          # Angular demo at /angular (handle both browser/ subdir and flat output)
          if [ -d apps/angular-demo/dist/angular-demo/browser ]; then
            cp -r apps/angular-demo/dist/angular-demo/browser/. deploy/angular/
          else
            cp -r apps/angular-demo/dist/angular-demo/. deploy/angular/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
