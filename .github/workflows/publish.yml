name: Publish to npm

# Published with npm trusted publishing: npm trusts this workflow (OIDC, `id-token: write`) for
# each of the three packages, so there is no token to keep or to expire. Each package names this
# repo and `publish.yml` as its trusted publisher on npmjs.com.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma-separated: core,react,angular or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - react
          - angular
      dry-run:
        description: 'Dry run (no actual publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older one.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Build React package
        run: npm run build

      - name: Build Angular package
        run: npm run build:angular

      - name: Run unit tests
        run: npm run test

      - name: Determine packages to publish
        id: packages
        run: |
          PACKAGES="${{ github.event.inputs.packages || 'all' }}"
          if [ "$PACKAGES" = "all" ]; then
            echo "core=true" >> $GITHUB_OUTPUT
            echo "react=true" >> $GITHUB_OUTPUT
            echo "angular=true" >> $GITHUB_OUTPUT
          else
            echo "core=false" >> $GITHUB_OUTPUT
            echo "react=false" >> $GITHUB_OUTPUT
            echo "angular=false" >> $GITHUB_OUTPUT
            IFS=',' read -ra ITEMS <<< "$PACKAGES"
            for item in "${ITEMS[@]}"; do
              echo "$item=true" >> $GITHUB_OUTPUT
            done
          fi

      - name: Set dry-run flag
        id: flags
        run: |
          DRY_RUN="${{ github.event.inputs.dry-run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "flag=--dry-run" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
          fi

      - name: Publish @widgetstools/dock-manager-core
        if: steps.packages.outputs.core == 'true'
        run: npm publish --workspace=@widgetstools/dock-manager-core --provenance --access public ${{ steps.flags.outputs.flag }}

      - name: Publish @widgetstools/react-dock-manager
        if: steps.packages.outputs.react == 'true'
        run: npm publish --workspace=@widgetstools/react-dock-manager --provenance --access public ${{ steps.flags.outputs.flag }}

      - name: Publish @widgetstools/angular-dock-manager
        if: steps.packages.outputs.angular == 'true'
        working-directory: dist/angular-dock-manager
        run: npm publish --provenance --access public ${{ steps.flags.outputs.flag }}
